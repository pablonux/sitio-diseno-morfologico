<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Diseño Morfológico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F2EC; --paper-2:#E9E5D9; --ink:#1B1A17; --ink-soft:#5B584E;
    --accent:#0B5FA5; --accent-ink:#fff; --line:rgba(27,26,23,0.18); --danger:#B3261E;
    --font-display:'Space Grotesk',sans-serif; --font-body:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);line-height:1.5;padding-bottom:120px;}
  .wrap{max-width:880px;margin:0 auto;padding:0 20px;}
  header{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);z-index:10;padding:16px 0;}
  header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  h1{font-family:var(--font-display);font-size:18px;margin:0;}
  h2{font-family:var(--font-display);font-size:20px;margin:0 0 4px;}
  h3{font-family:var(--font-display);font-size:16px;margin:0;}
  section.panel{background:#fff;border:1px solid var(--line);padding:22px;margin:22px 0;}
  label{display:block;font-size:13px;color:var(--ink-soft);margin:14px 0 4px;}
  label:first-child{margin-top:0;}
  input[type=text], textarea{
    width:100%;font-family:var(--font-body);font-size:15px;padding:9px 10px;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);
  }
  textarea{min-height:90px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:600px){ .row2{grid-template-columns:1fr;} }
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:8px;}
  .gallery figure{margin:0;position:relative;}
  .gallery img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--line);display:block;}
  .gallery button.del{
    position:absolute;top:2px;right:2px;background:var(--danger);color:#fff;border:0;
    width:20px;height:20px;font-size:12px;cursor:pointer;line-height:1;
  }
  button{font-family:var(--font-body);font-size:14px;cursor:pointer;}
  .btn{background:var(--accent);color:var(--accent-ink);border:0;padding:9px 16px;}
  .btn:hover{opacity:0.9;}
  .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn:disabled{opacity:0.5;cursor:default;}
  .upload-btn{margin-top:8px;}
  .tema-card{border:1px solid var(--line);padding:16px;margin-top:16px;}
  .tema-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;}
  .tema-order{display:flex;gap:4px;align-items:center;}
  .tema-order button{width:26px;height:26px;border:1px solid var(--line);background:#fff;}
  .tema-order button.btn.danger{width:auto;height:auto;padding:4px 10px;margin-left:8px;}
  #status{position:fixed;left:0;right:0;bottom:0;padding:14px 20px;font-size:14px;display:none;}
  #status.ok{display:block;background:#DDF3DF;color:#155724;}
  #status.err{display:block;background:#FBE3E1;color:#7A1E17;}
  .save-bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);padding:14px 20px;display:flex;justify-content:center;gap:12px;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Panel de administración — Diseño Morfológico</h1>
    <a href="/" class="btn secondary" style="text-decoration:none;">Ver sitio</a>
  </div>
</header>

<div class="wrap" id="app">
  <p style="color:var(--ink-soft);">Cargando contenido…</p>
</div>

<div class="save-bar">
  <button class="btn" id="btnSave">Guardar todo</button>
</div>
<div id="status"></div>

<script>
(function(){
  var state = null;
  var app = document.getElementById('app');
  var statusEl = document.getElementById('status');

  function slugify(s){
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // saca acentos
      .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  function showStatus(msg, ok){
    statusEl.textContent = msg;
    statusEl.className = ok ? 'ok' : 'err';
    setTimeout(function(){ statusEl.className = ''; }, 4000);
  }

  // ---------- limpieza de datos ----------
  // Temas que ya no forman parte del sitio. Si todavía están guardados,
  // se sacan al cargar el panel y desaparecen del todo en el próximo "Guardar todo".
  var TEMAS_OCULTOS = ['forma', 'recorrido', 'linea'];

  function normalizar(d){
    d.hero = d.hero || {};
    d.exploracion = d.exploracion || { texto: '', imagenes: [], youtubeId: null };
    d.exploracion.imagenes = d.exploracion.imagenes || [];
    // "Ejecución" ya no se muestra en el sitio ni en este panel; se conserva
    // vacía porque el servicio que guarda los datos la sigue pidiendo.
    d.ejecucion = d.ejecucion || { texto: '', imagenes: [], youtubeId: null };
    d.temas = (d.temas || []).filter(function(t){
      return TEMAS_OCULTOS.indexOf(t.id) === -1;
    }).map(function(t){
      t.imagenes = t.imagenes || [];
      return t;
    });
    var hayTextura = d.temas.some(function(t){ return t.id === 'textura'; });
    if(!hayTextura){
      d.temas.push({ id: 'textura', nombre: 'Textura', texto: '', imagenes: [], youtubeId: null });
    }
  }

  // ---------- carga ----------
  function load(){
    fetch('/api/content')
      .then(function(r){ return r.json(); })
      .then(function(data){
        state = data;
        normalizar(state);
        render();
      })
      .catch(function(err){
        app.innerHTML = '<p style="color:var(--danger);">No se pudo cargar el contenido. Recargá la página.</p>';
        console.error(err);
      });
  }

  // ---------- subida de imágenes ----------
  function uploadImage(file, temaId, onDone){
    var fd = new FormData();
    fd.append('file', file);
    fd.append('temaId', temaId);
    fetch('/api/admin/upload', { method: 'POST', body: fd })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(!res.ok){ showStatus('Error subiendo imagen: ' + (res.error || ''), false); return; }
        onDone(res.url);
      })
      .catch(function(err){ showStatus('Error subiendo imagen', false); console.error(err); });
  }

  function galleryBlock(imagenes, temaId, onChange){
    var wrap = document.createElement('div');

    function renderImgs(){
      var g = wrap.querySelector('.gallery');
      g.innerHTML = '';
      imagenes.forEach(function(url, i){
        var fig = document.createElement('figure');
        fig.innerHTML = '<img src="' + url + '" loading="lazy"><button type="button" class="del" title="Quitar">×</button>';
        fig.querySelector('.del').addEventListener('click', function(){
          imagenes.splice(i, 1);
          renderImgs();
          onChange();
        });
        g.appendChild(fig);
      });
    }

    var fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.accept = 'image/*'; fileInput.style.display = 'none';
    fileInput.addEventListener('change', function(){
      if(!fileInput.files.length) return;
      var file = fileInput.files[0];
      var btn = wrap.querySelector('.upload-btn');
      btn.disabled = true; btn.textContent = 'Subiendo…';
      uploadImage(file, temaId, function(url){
        imagenes.push(url);
        renderImgs();
        onChange();
        btn.disabled = false; btn.textContent = 'Subir imagen';
        fileInput.value = '';
      });
    });

    var uploadBtn = document.createElement('button');
    uploadBtn.type = 'button'; uploadBtn.className = 'btn secondary upload-btn';
    uploadBtn.textContent = 'Subir imagen';
    uploadBtn.addEventListener('click', function(){ fileInput.click(); });

    var g = document.createElement('div'); g.className = 'gallery';
    wrap.appendChild(g);
    wrap.appendChild(uploadBtn);
    wrap.appendChild(fileInput);
    renderImgs();
    return wrap;
  }

  // ---------- render ----------
  function render(){
    app.innerHTML = '';
    app.appendChild(heroPanel());
    app.appendChild(bloquePanel('exploracion', 'Exploración'));
    app.appendChild(temasPanel());
  }

  function panelShell(title, tag){
    var s = document.createElement('section'); s.className = 'panel';
    var h = document.createElement('h2'); h.textContent = title; s.appendChild(h);
    if(tag){ var p = document.createElement('p'); p.className = 'hint'; p.textContent = tag; s.appendChild(p); }
    return s;
  }

  function heroPanel(){
    var s = panelShell('Datos generales');
    var row = document.createElement('div'); row.className = 'row2';
    [['docente','Docente'], ['ayudante','Ayudante de cátedra'], ['curso','Curso'], ['ciclo','Ciclo lectivo']].forEach(function(f){
      var col = document.createElement('div');
      var label = document.createElement('label'); label.textContent = f[1];
      var input = document.createElement('input'); input.type = 'text'; input.value = state.hero[f[0]] || '';
      input.addEventListener('input', function(){ state.hero[f[0]] = input.value; });
      col.appendChild(label); col.appendChild(input);
      row.appendChild(col);
    });
    s.appendChild(row);
    return s;
  }

  function youtubeField(obj, label){
    var l = document.createElement('label'); l.textContent = label;
    var input = document.createElement('input'); input.type = 'text';
    input.placeholder = 'ID o link de YouTube — dejar vacío si no hay video (si está vacío, el sitio no muestra ningún cuadro de video)';
    input.value = obj.youtubeId || '';
    input.addEventListener('input', function(){ obj.youtubeId = input.value.trim() || null; });
    var hint = document.createElement('p'); hint.className = 'hint';
    hint.textContent = 'Subí el video a YouTube como "No listado" y pegá acá el link completo o solo el ID (lo que aparece después de "v=").';
    var wrap = document.createElement('div');
    wrap.appendChild(l); wrap.appendChild(input); wrap.appendChild(hint);
    return wrap;
  }

  function bloquePanel(key, title){
    var s = panelShell(title);
    var data = state[key];

    var lt = document.createElement('label'); lt.textContent = 'Texto';
    var ta = document.createElement('textarea'); ta.value = data.texto || '';
    ta.addEventListener('input', function(){ data.texto = ta.value; });
    s.appendChild(lt); s.appendChild(ta);

    var lg = document.createElement('label'); lg.textContent = 'Fotos';
    s.appendChild(lg);
    s.appendChild(galleryBlock(data.imagenes, key, function(){}));

    s.appendChild(youtubeField(data, 'Video'));
    return s;
  }

  function temasPanel(){
    var s = panelShell('Secciones (temas)', 'Cada tema tiene su propia URL para el QR (ej: .../#' + (state.temas[0] ? state.temas[0].id : 'id-del-tema') + ').');

    state.temas.forEach(function(t, i){
      s.appendChild(temaCard(t, i));
    });

    var addBtn = document.createElement('button');
    addBtn.type = 'button'; addBtn.className = 'btn secondary'; addBtn.style.marginTop = '16px';
    addBtn.textContent = '+ Agregar tema';
    addBtn.addEventListener('click', function(){
      state.temas.push({ id: '', nombre: '', texto: '', imagenes: [], youtubeId: null });
      render();
    });
    s.appendChild(addBtn);
    return s;
  }

  function temaCard(t, i){
    var card = document.createElement('div'); card.className = 'tema-card';

    var head = document.createElement('div'); head.className = 'tema-head';
    var h3 = document.createElement('h3'); h3.textContent = t.nombre || '(tema sin nombre)';

    var order = document.createElement('div'); order.className = 'tema-order';
    var up = document.createElement('button'); up.type = 'button'; up.textContent = '↑';
    up.disabled = i === 0;
    up.addEventListener('click', function(){
      var tmp = state.temas[i-1]; state.temas[i-1] = state.temas[i]; state.temas[i] = tmp; render();
    });
    var down = document.createElement('button'); down.type = 'button'; down.textContent = '↓';
    down.disabled = i === state.temas.length - 1;
    down.addEventListener('click', function(){
      var tmp = state.temas[i+1]; state.temas[i+1] = state.temas[i]; state.temas[i] = tmp; render();
    });
    var del = document.createElement('button'); del.type = 'button'; del.className = 'btn danger';
    del.textContent = 'Eliminar';
    del.addEventListener('click', function(){
      if(confirm('¿Eliminar el tema "' + (t.nombre || t.id) + '"? Esto no se puede deshacer.')){
        state.temas.splice(i, 1); render();
      }
    });
    order.appendChild(up); order.appendChild(down); order.appendChild(del);
    head.appendChild(h3); head.appendChild(order);
    card.appendChild(head);

    var row = document.createElement('div'); row.className = 'row2';

    var colNombre = document.createElement('div');
    var lNombre = document.createElement('label'); lNombre.textContent = 'Nombre';
    var iNombre = document.createElement('input'); iNombre.type = 'text'; iNombre.value = t.nombre || '';
    iNombre.addEventListener('input', function(){
      t.nombre = iNombre.value;
      h3.textContent = t.nombre || '(tema sin nombre)';
      // si el id todavía no fue tocado a mano, lo sugerimos a partir del nombre
      if(!t._idManual){ t.id = slugify(t.nombre); iId.value = t.id; }
    });
    colNombre.appendChild(lNombre); colNombre.appendChild(iNombre);

    var colId = document.createElement('div');
    var lId = document.createElement('label'); lId.textContent = 'Id (para la URL / QR)';
    var iId = document.createElement('input'); iId.type = 'text'; iId.value = t.id || '';
    iId.addEventListener('input', function(){ t.id = slugify(iId.value); t._idManual = true; iId.value = t.id; });
    colId.appendChild(lId); colId.appendChild(iId);
    var hintId = document.createElement('p'); hintId.className = 'hint';
    hintId.textContent = 'Solo minúsculas, números y guiones. No repetir entre temas.';
    colId.appendChild(hintId);

    row.appendChild(colNombre); row.appendChild(colId);
    card.appendChild(row);

    var lTexto = document.createElement('label'); lTexto.textContent = 'Texto del tema';
    var taTexto = document.createElement('textarea'); taTexto.value = t.texto || '';
    taTexto.addEventListener('input', function(){ t.texto = taTexto.value; });
    card.appendChild(lTexto); card.appendChild(taTexto);

    var lFotos = document.createElement('label'); lFotos.textContent = 'Fotos';
    card.appendChild(lFotos);
    card.appendChild(galleryBlock(t.imagenes, t.id || ('tema-' + i), function(){}));

    card.appendChild(youtubeField(t, 'Video'));

    return card;
  }

  // ---------- guardar ----------
  function save(){
    // validación mínima antes de mandar
    var ids = {};
    for(var i=0;i<state.temas.length;i++){
      var t = state.temas[i];
      if(!t.nombre || !t.nombre.trim()){ showStatus('Falta el nombre de uno de los temas.', false); return; }
      if(!t.id){ t.id = slugify(t.nombre); }
      if(ids[t.id]){ showStatus('Hay dos temas con el mismo id: "' + t.id + '". Cambiá uno.', false); return; }
      ids[t.id] = true;
    }

    var btn = document.getElementById('btnSave');
    btn.disabled = true; btn.textContent = 'Guardando…';

    fetch('/api/admin/content', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state)
    })
      .then(function(r){ return r.json().then(function(j){ return { status: r.status, body: j }; }); })
      .then(function(res){
        btn.disabled = false; btn.textContent = 'Guardar todo';
        if(res.body && res.body.ok){
          showStatus('Guardado. Los cambios ya están visibles en el sitio.', true);
          render(); // por si algún id se autocompletó
        } else {
          showStatus('Error al guardar: ' + (res.body && res.body.error || res.status), false);
        }
      })
      .catch(function(err){
        btn.disabled = false; btn.textContent = 'Guardar todo';
        showStatus('Error de red al guardar.', false);
        console.error(err);
      });
  }

  document.getElementById('btnSave').addEventListener('click', save);
  load();
})();
</script>
</body>
</html>
